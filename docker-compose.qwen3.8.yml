# =============================================================================
# docker-compose.qwen3.8.yml — Qwen3.8-27B-NVFP4 (Unsloth) on NVIDIA DGX Spark (GB10)
#
# Main stack configuration. Includes full Langfuse/LiteLLM observability stack.
# Replaces docker-compose.qwen3.6.yml as the primary/default chat stack.
# docker-compose.qwen3.6.yml is left in place (not deleted) for rollback —
# same policy this project already uses for abandoned configs (see the
# .unsloth-nvfp4-fast.bak sibling file next to that one).
#
# Usage:
#   docker compose -f docker-compose.qwen3.8.yml up -d
#
# USE CASE: serving Cline and Claude Code (AI coding agents) via LiteLLM.
# PRIORITY: runtime coding performance over startup/restart time — same
# deliberate priority docker-compose.qwen3.6.yml documents for the same
# use case.
#
# =============================================================================
# PROVENANCE — what's verified vs. assumed in this file (read before tuning)
# =============================================================================
# This is a NEW file with no boot history yet, unlike qwen3.6's file (which
# accumulated 17 corrections from real boots). Flags below fall into three
# buckets:
#
#   VERIFIED — checked directly against primary sources this session:
#     - Model architecture: fetched config.json from
#       https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4 directly.
#       architectures: ["Qwen3_5ForConditionalGeneration"], model_type:
#       "qwen3_5". DENSE (not MoE) — no "Moe" in the architecture class,
#       27B total params, vision encoder present (27 vision transformer
#       blocks), max_position_embeddings 262144, quantization_config uses
#       compressed-tensors v0.17.2 (mixed FP8 for attention/some MLP,
#       NVFP4-pack for remaining MLP) — NOT NVIDIA ModelOpt, a different
#       quantization scheme than qwen3.6's nvidia/Qwen3.6-35B-A3B-NVFP4.
#     - vLLM compatibility: pulled vllm/vllm-openai:nightly fresh this
#       session (digest sha256:95bed119f39e2414973cf7224df31c9a3ed213566
#       138722346d7bd360edf842b, vLLM 0.26.1rc1.dev1102+ge9d1398d9) and
#       introspected its model registry directly — Qwen3_5ForConditionalGeneration
#       IS registered, confirming this exact image can load this checkpoint's
#       architecture class. This is a live-checked fact, not an inference
#       from release notes.
#     - Sampling defaults: from https://unsloth.ai/docs/models/qwen3.8 (Thinking
#       Mode: temperature 1.0, top_p 0.95, top_k 20, min_p 0.0, presence_penalty
#       0.0; Instruct Mode: temperature 0.7, top_p 0.80, top_k 20, min_p 0.0,
#       presence_penalty 1.5) and the exact quoted MTP speculative-decoding
#       example on that page: --speculative-config '{"method":"mtp",
#       "num_speculative_tokens":2}'.
#     - "No --quantization flag needed" — stated explicitly on both the HF
#       model card and the Unsloth docs page (auto-detected from the
#       compressed-tensors config in the checkpoint).
#     - "Only works in vLLM, not SGLang" — the lm_head is FP8-quantized;
#       SGLang can't load it. Not relevant to this file (already on vLLM)
#       but explains why this project's vLLM-only approach is the right one
#       for this checkpoint specifically.
#
#   CARRIED BY ANALOGY — not confirmed for THIS model, but reused from
#   qwen3.6's proven config because both are the same "qwen3_5" hybrid
#   Gated-DeltaNet + Gated-Attention architecture family on the same GB10
#   hardware, and qwen3.6's file already paid the cost of discovering these
#   empirically:
#     - --mamba-ssm-cache-dtype float32 (GDN/SSM layer stability)
#     - --kv-cache-dtype fp8, --load-format fastsafetensors,
#       --attention-backend flashinfer, --enable-chunked-prefill,
#       --async-scheduling, --enable-prefix-caching
#     - --gpu-memory-utilization: SEE CORRECTIONS HISTORY BELOW — the 0.4
#       carried over from qwen3.6 was tested and confirmed WRONG for this
#       model on first real boot.
#     - --tool-call-parser qwen3_xml: qwen3.6's file (see its own corrections
#       history, items 11/16/17) went back and forth between qwen3_xml and
#       qwen3_coder for tool-call parsing and settled on qwen3_xml with the
#       reasoning "qwen3_coder's parser targets the format Qwen3-Coder models
#       were trained to emit; this is a general-purpose (non-Coder) Qwen3
#       checkpoint." Qwen3.8-27B is likewise not a Coder-branded model, so
#       the same reasoning applies — but this is NOT independently confirmed
#       for Qwen3.8. FIRST THING TO CHECK if Cline/Claude Code tool calls
#       fail to parse correctly.
#
#   NOT CARRIED FORWARD — qwen3.6-specific, doesn't apply here:
#     - VLLM_USE_FLASHINFER_MOE_FP4, VLLM_FP8_MOE_BACKEND, --moe-backend
#       marlin, the "moe_backend":"triton" speculative-config key — all
#       MoE-specific. This checkpoint is DENSE (confirmed via config.json,
#       see above), so there is no expert-routing layer to configure. A
#       dense model's MTP head should not need the MoE-unquantized-backend
#       workaround qwen3.6's Unsloth-compressed-tensors experiment hit
#       (see that file's corrections items 13-14) — that bug was specifically
#       in FusedMoE layer resolution, which doesn't exist in a dense model.
#       Still worth watching on first boot given both checkpoints share the
#       compressed-tensors quantization library.
#     - --compilation-config with the densified cudagraph_capture_sizes list:
#       that list existed to close a warmup gap in a Triton fused-MoE kernel
#       (fused_moe_kernel) — not applicable to a dense model. Left at vLLM's
#       default capture-size inference for this first cut; revisit if
#       jit_monitor.py-style warnings show up mid-inference in the logs.
#
#   UNCERTAIN / EXPLICITLY FLAGGED IN THIS FILE — see inline comments below:
#     - VLLM_NVFP4_GEMM_BACKEND=marlin: qwen3.6's corrections note 2 found
#       this env var necessary for NVIDIA ModelOpt NVFP4 on SM121 (GB10),
#       because vLLM's native FlashInfer NVFP4 kernels target SM90/SM100,
#       not SM121. Whether this same env var is read by the (different)
#       compressed-tensors NVFP4 code path is UNVERIFIED — left commented
#       out below with instructions for when to try it.
#
# During this research, web search also surfaced several NVIDIA-forum-style
# threads and small GitHub repos with very specific-looking DGX Spark launch
# commands and benchmark numbers for this exact model. They are NOT used as
# a source in this file — the details didn't cross-check cleanly (an invented
# -sounding container image name, a nonexistent-sounding "DFlash" speculative
# decoding technique) and couldn't be corroborated independently. Treat
# anything from those threads as unverified if you go looking for them.
#
# =============================================================================
# CORRECTIONS HISTORY (first real boots — 2026-08-23)
# =============================================================================
#   1. --gpu-memory-utilization 0.4 → 0.6. First boot attempt crashed with:
#        ValueError: No available memory for the cache blocks. Try increasing
#        `gpu_memory_utilization`...
#      vLLM's own log right before the crash explained why: "The current
#      --gpu-memory-utilization=0.4000 is equivalent to --gpu-memory-
#      utilization=0.3841 without CUDA graph memory profiling. To maintain the
#      same effective KV cache size as before, increase
#      --gpu-memory-utilization to 0.4159." Even that breakeven number would
#      have left ~zero real KV cache room, not just less than qwen3.6 had —
#      this model's peak-memory profiling pass (which includes profiling the
#      vision encoder/multimodal path qwen3.6's text-only checkpoint never
#      had to account for) eats meaningfully more headroom than qwen3.6's did
#      at the same utilization value. 0.4 was a CARRIED-BY-ANALOGY assumption
#      from qwen3.6's file, not verified for this model — this is exactly the
#      kind of thing that section warned about. Confirmed weight load itself
#      is ~22.13 GiB (log: "Model loading took 22.13 GiB memory"), in line
#      with qwen3.6's ~22GB. 0.6 is a first real-headroom attempt, not a
#      measured optimum — verify actual KV cache size in the boot log
#      ("... GiB KV cache, ... tokens, ...x concurrency") once healthy, and
#      watch `free -h` for swap the same way qwen3.6's file did at each
#      utilization value it tried.
#   2. CONFIRMED (not carried-by-analogy) on this same first-boot log:
#      compressed-tensors NVFP4 auto-selected FlashInferCutlassNvFp4LinearKernel
#      for NVFP4 GEMM, and CutlassFP8ScaledMMLinearKernel for the FP8 layers —
#      both native kernel selections, no Marlin fallback needed. This is
#      DIFFERENT from qwen3.6's ModelOpt-scheme experience (which required
#      Marlin because FlashInfer's native path didn't cover SM121 for that
#      scheme) — so the "UNCERTAIN" VLLM_NVFP4_GEMM_BACKEND=marlin escape
#      hatch below looks unnecessary for this checkpoint. Left commented out
#      rather than deleted, in case a different failure mode surfaces later.
#      Also confirmed: MTP drafter resolved as "Qwen3_5MTP" and loaded (3.78s,
#      sharing embedding + lm_head weights with the target model) with no
#      MoE-backend error — the dense-model assumption in this file held.
# =============================================================================
#
# Source (checkpoint): https://huggingface.co/unsloth/Qwen3.8-27B-NVFP4
# Source (docs):       https://unsloth.ai/docs/models/qwen3.8
#
# Hardware: NVIDIA DGX Spark workstation with GB10 Superchip (128 GB unified memory)
#
# Image:    vllm/vllm-openai:nightly (ARM64)
#           Pulled and verified this session — digest
#           sha256:95bed119f39e2414973cf7224df31c9a3ed213566138722346d7bd360edf842b
#           (vLLM 0.26.1rc1.dev1102+ge9d1398d9). Confirms
#           Qwen3_5ForConditionalGeneration is registered. After a working
#           boot, consider pinning to this digest the same way qwen3.6's
#           file recommends:
#             docker inspect --format '{{index .RepoDigests 0}}' vllm/vllm-openai:nightly
#
# Model:    unsloth/Qwen3.8-27B-NVFP4
#           27B dense (NOT MoE), hybrid Gated-DeltaNet + Gated-Attention,
#           vision encoder included, compressed-tensors NVFP4/FP8 mixed
#           quantization, ~20B params' worth of checkpoint on disk (per HF)
#
# GB10 memory budget (128GB unified — shared with CPU + every other container):
#   Weights (compressed-tensors NVFP4+FP8):  22.13 GiB (confirmed via boot log,
#     see CORRECTIONS HISTORY below — about the same as qwen3.6's ~22GB, not
#     smaller as originally assumed from the ~20B-params-on-disk HF figure)
#   Framework/CUDA + CUDA-graph profiling:   larger than qwen3.6's, apparently
#     due to vision-encoder/multimodal profiling overhead — see CORRECTIONS
#     HISTORY below (0.4 utilization crashed with zero room for KV cache)
#   KV cache (fp8):                          remainder at 0.6 utilization —
#     NOT yet measured; verify in the boot log once healthy and adjust.
#
# IMPORTANT — FP4/FP8 compute on GB10 (SM121):
#   Same hardware constraint documented at length in qwen3.6's file: GB10 has
#   native NVFP4 tensor-core support, but vLLM's FlashInfer-based native
#   FP4 GEMM/MoE kernels currently target Hopper/datacenter Blackwell
#   (SM90/SM100), not SM121. Whether that fallback story is identical for
#   this checkpoint's compressed-tensors quantization (vs. qwen3.6's
#   ModelOpt scheme) is UNVERIFIED — watch first-boot logs for "Failed to
#   find a kernel that can implement..." errors; if seen, try uncommenting
#   VLLM_NVFP4_GEMM_BACKEND=marlin below (qwen3.6's fix for the analogous
#   ModelOpt-scheme error) as the first thing to test.
#
# External ports (reachable from other machines) — SAME as qwen3.6's file,
# since this replaces it as the primary stack (only one chat stack runs at
# a time; reusing ports means any existing Cline/Claude Code config pointing
# at localhost:8301/4000 keeps working after the swap):
#   3000  — Langfuse UI + API
#   4000  — LiteLLM Proxy (OpenAI-compatible) + UI at /ui
#   8301  — vLLM engine (direct; prefer routing via LiteLLM on 4000)
#   8302  — vLLM embedding engine (nvidia/Nemotron-3-Embed-1B-NVFP4, direct)
#   9090  — MinIO S3 API
#   9091  — MinIO console UI
#
# Internal-only ports (127.0.0.1 — local machine only):
#   5432  — PostgreSQL
#   8123  — ClickHouse HTTP
#   9000  — ClickHouse native protocol
#   6379  — Redis
#   3030  — Langfuse worker
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — shared instance; two isolated databases:
  #   "postgres" for Langfuse, "litellm" for LiteLLM
  # TZ=UTC / PGTZ=UTC required — non-UTC causes incorrect Langfuse query results
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: langfuse-postgres
    networks:
      - ai-bridge
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}           # set in .env
      POSTGRES_DB: ${POSTGRES_DB:-postgres}             # Langfuse DB (default)
      TZ: UTC                                            # required by Langfuse v3
      PGTZ: UTC
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ClickHouse — OLAP store for Langfuse traces, observations, and scores
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: langfuse-clickhouse
    networks:
      - ai-bridge
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/langfuse.xml:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE_TO_RAM_RATIO: "0.02"
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD", "clickhouse-client",
             "--user", "${CLICKHOUSE_USER:-clickhouse}",
             "--password", "${CLICKHOUSE_PASSWORD}",
             "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — Langfuse event queue + API-key / prompt cache, LiteLLM prompt cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    networks:
      - ai-bridge
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      --requirepass ${REDIS_AUTH}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    deploy:
      resources:
        limits:
          memory: 640M
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible blob storage for Langfuse trace event payloads
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio
    container_name: langfuse-minio
    networks:
      - ai-bridge
    ports:
      - "9090:9000"
      - "9091:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO Init — creates the "langfuse" bucket on first start, then exits
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc
    container_name: langfuse-minio-init
    networks:
      - ai-bridge
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/langfuse;
        echo 'MinIO bucket ready';
      "
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Langfuse Worker — async event processor (REQUIRED in v3)
  # ---------------------------------------------------------------------------
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    networks:
      - ai-bridge
    ports:
      - "127.0.0.1:3030:3030"
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-clickhouse}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: us-east-1
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH}
      # Node.js heap cap — qwen3.6's file discovered V8 doesn't reliably
      # respect a Docker cgroup memory limit under real trace-ingestion load;
      # applying the same fix here preemptively rather than after a crash.
      NODE_OPTIONS: "--max-old-space-size=1024"
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Langfuse Web — UI + public ingestion API
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse
    networks:
      - ai-bridge
    ports:
      - "3000:3000"
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      NODE_OPTIONS: "--max-old-space-size=1024"
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # vLLM Engine — unsloth/Qwen3.8-27B-NVFP4
  # NVIDIA DGX Spark — GB10 Superchip (128GB unified memory)
  # See the PROVENANCE header at the top of this file for what's verified
  # vs. assumed in the command/environment below.
  # ---------------------------------------------------------------------------
  qwen3-8-27b-nvfp4-engine:
    image: vllm/vllm-openai:nightly
    platform: linux/arm64
    container_name: qwen3-8-27b-nvfp4-engine
    networks:
      - ai-bridge
    ports:
      - "8301:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Separate cache volumes from qwen3.6's engine — different model,
      # different autotune cache key. Keeping both around lets you switch
      # back and forth between the two compose files without cache thrashing.
      - vllm-qwen38-compile-cache:/root/.cache/vllm
      - vllm-qwen38-flashinfer-cache:/root/.cache/flashinfer
      - vllm-qwen38-triton-cache:/root/.triton/cache
    environment:
      HF_TOKEN: ${HF_TOKEN}
      TRITON_CACHE_DIR: /root/.triton/cache
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      CUTE_DSL_ARCH: sm_121a                # GB10 Blackwell SM architecture — hardware fact, model-independent
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      # THROUGHPUT INVESTIGATION (2026-08-23) — CONCLUDED, both levers tried
      # and reverted. Measured baseline: median generation throughput 19.5-
      # 20.1 tok/s vs qwen3.6's ~40 tok/s, with 96% GPU utilization but only
      # ~34W power draw during generation (GPU kept busy without doing much
      # real compute per unit time — consistent with immature SM121 kernel
      # support for this quantization scheme, not a hardware ceiling).
      #
      #   Tried: VLLM_NVFP4_GEMM_BACKEND=marlin alone. NO EFFECT — kernel-
      #   selection log was identical before/after ("Using
      #   FlashInferCutlassNvFp4LinearKernel for NVFP4 GEMM"), and a real
      #   (non-cached) generation measured the same 20.1 tok/s. This env var
      #   is specific to the ModelOpt quantization scheme (qwen3.6's
      #   checkpoint) and is not read by the compressed-tensors NVFP4-pack
      #   scheme this checkpoint uses.
      #
      #   Tried: --linear-backend marlin + VLLM_TEST_FORCE_FP8_MARLIN=1
      #   together (forces BOTH NVFP4 and FP8 layers through Marlin —
      #   confirmed via log: "Selected MarlinFP8ScaledMMLinearKernel for
      #   CompressedTensorsW8A8Fp8" / "Using MarlinNvFp4LinearKernel for
      #   NVFP4 GEMM", so the flag *was* respected this time, unlike the
      #   NVFP4-only attempt above). CRASHED on every boot attempt:
      #     AttributeError: 'ParallelLMHead' object has no attribute
      #     'output_size_per_partition'
      #   in vllm/model_executor/layers/quantization/utils/marlin_utils_fp8.py
      #   prepare_fp8_layer_for_marlin(). Root cause: this checkpoint's
      #   lm_head is itself FP8-quantized (per the HF model card), and
      #   vLLM's Marlin FP8 weight-prep path doesn't handle the
      #   ParallelLMHead layer type — a real vLLM bug for this specific
      #   model, not a config problem. Different failure mode than qwen3.6
      #   hit trying the same flag (qwen3.6's GDN attention projection
      #   layers failed a different way) — same flag, same hardware, two
      #   different incompatibilities on two different checkpoints.
      #
      #   CONCLUSION: no working lever currently exists in this vLLM build
      #   to change kernel selection for this checkpoint away from the
      #   default (Cutlass NVFP4 + Cutlass/DeepGEMM FP8). The ~20 tok/s
      #   baseline appears to require either (a) a newer vLLM/CUTLASS build
      #   with better SM121-tuned kernels for compressed-tensors NVFP4+FP8,
      #   or (b) a fix to the Marlin FP8 lm_head bug found above, upstream.
      #   Neither requires a new NVIDIA driver/firmware release — this is a
      #   software/kernel-library maturity gap, not a hardware limitation.
      #   Re-test after pulling a newer vllm/vllm-openai:nightly.
      #
      # ESCAPE HATCH (leave commented): if generation output looks wrong
      # after a FlashInfer autotune cache load on a newer nightly, uncomment
      # to disable the persistent cache and report upstream.
      # VLLM_DISABLE_FLASHINFER_AUTOTUNE_CACHE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    shm_size: '16gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 3600s
    # ---------------------------------------------------------------------------
    # --speculative-config: num_speculative_tokens defaults to 2, matching the
    # exact value in Unsloth's own documented example for this model (see
    # PROVENANCE header). QWEN38_NUM_SPECULATIVE_TOKENS (.env) is an A/B
    # toggle, same pattern as qwen3.6's QWEN36_NUM_SPECULATIVE_TOKENS — no
    # "moe_backend" key here, since this is a dense model (see PROVENANCE).
    #
    # --override-generation-config uses the "Thinking Mode" defaults from
    # Unsloth's docs (temperature 1.0). The model also has separately
    # documented "Instruct Mode" defaults (temperature 0.7, top_p 0.80,
    # presence_penalty 1.5) if you want faster/more deterministic output for
    # agentic tool-calling and find thinking-mode traces aren't worth the
    # extra tokens for this use case — swap these values to switch.
    # ---------------------------------------------------------------------------
    command: >
      unsloth/Qwen3.8-27B-NVFP4
      --served-model-name qwen3.8-27b
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --kv-cache-dtype fp8
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.6
      --max-model-len 262144
      --max-num-seqs 4
      --enable-chunked-prefill
      --async-scheduling
      --max-num-batched-tokens 8192
      --load-format fastsafetensors
      --mamba-ssm-cache-dtype float32
      --attention-backend flashinfer
      --uvicorn-log-level warning
      --trust-remote-code
      --enable-auto-tool-choice
      --tool-call-parser qwen3_xml
      --reasoning-parser qwen3
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":${QWEN38_NUM_SPECULATIVE_TOKENS:-2}}'
      --default-chat-template-kwargs '{"preserve_thinking":true}'
      --override-generation-config '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # vLLM Embedding Engine — nvidia/Nemotron-3-Embed-1B-NVFP4
  # Identical to the service in docker-compose.qwen3.6.yml — same model, same
  # cache volume name (vllm-embed-compile-cache is a Docker-host-wide named
  # volume, not scoped to one compose file, so it's reused as-is here without
  # re-downloading or re-compiling).
  # Source: https://huggingface.co/nvidia/Nemotron-3-Embed-1B-NVFP4
  # ---------------------------------------------------------------------------
  nemotron-embed-engine:
    image: vllm/vllm-openai:nightly
    platform: linux/arm64
    container_name: nemotron-embed-engine
    networks:
      - ai-bridge
    ports:
      - "8302:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - vllm-embed-compile-cache:/root/.cache/vllm
    environment:
      HF_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 900s
    command: >
      nvidia/Nemotron-3-Embed-1B-NVFP4
      --served-model-name nemotron-3-embed-1b-nvfp4
      --host 0.0.0.0
      --port 8000
      --max-model-len 32768
      --max-num-batched-tokens 32768
      --max-cudagraph-capture-size 4096
      --gpu-memory-utilization 0.1
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LiteLLM Proxy — unified OpenAI-compatible API + Langfuse OTEL tracing
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    networks:
      - ai-bridge
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DROP_PARAMS: ${LITELLM_DROP_PARAMS:-true}
      LITELLM_MODIFY_PARAMS: ${LITELLM_MODIFY_PARAMS:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_OTEL_HOST: http://langfuse:3000
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LITELLM_CACHE: "true"
      LITELLM_CACHE_TYPE: "redis"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_AUTH}
    depends_on:
      postgres:
        condition: service_healthy
      qwen3-8-27b-nvfp4-engine:
        condition: service_healthy
      nemotron-embed-engine:
        condition: service_healthy
      langfuse-web:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--drop_params"]
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-bridge:
    driver: bridge

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
  vllm-qwen38-compile-cache:      # persists /root/.cache/vllm (torch.compile + FlashInfer autotune configs)
  vllm-qwen38-flashinfer-cache:   # persists /root/.cache/flashinfer (FlashInfer JIT kernel workspace)
  vllm-qwen38-triton-cache:       # persists /root/.triton/cache (Triton kernel JIT cache)
  vllm-embed-compile-cache:       # shared with docker-compose.qwen3.6.yml — same embedding model
