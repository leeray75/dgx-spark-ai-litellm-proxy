services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — shared instance; two isolated databases:
  #   "postgres" for Langfuse, "litellm" for LiteLLM
  # TZ=UTC / PGTZ=UTC required — non-UTC causes incorrect Langfuse query results
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: langfuse-postgres
    networks:
      - ai-bridge
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}           # set in .env
      POSTGRES_DB: ${POSTGRES_DB:-postgres}             # Langfuse DB (default)
      TZ: UTC                                            # required by Langfuse v3
      PGTZ: UTC
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_compression=on
    deploy:
      resources:
        limits:
          memory: 768M
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ClickHouse — OLAP store for Langfuse traces, observations, and scores
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: langfuse-clickhouse
    networks:
      - ai-bridge
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/langfuse.xml:ro
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_MAX_SERVER_MEMORY_USAGE_TO_RAM_RATIO: "0.02"
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD", "clickhouse-client",
             "--user", "${CLICKHOUSE_USER:-clickhouse}",
             "--password", "${CLICKHOUSE_PASSWORD}",
             "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Redis — Langfuse event queue + API-key / prompt cache, LiteLLM prompt cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: langfuse-redis
    networks:
      - ai-bridge
    ports:
      - "127.0.0.1:6379:6379"
    command: >
      --requirepass ${REDIS_AUTH}
      --maxmemory 512mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
    deploy:
      resources:
        limits:
          memory: 640M
    volumes:
      - langfuse-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_AUTH}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO — S3-compatible blob storage for Langfuse trace event payloads
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio
    container_name: langfuse-minio
    networks:
      - ai-bridge
    ports:
      - "9090:9000"
      - "9091:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - langfuse-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MinIO Init — creates the "langfuse" bucket on first start, then exits
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc
    container_name: langfuse-minio-init
    networks:
      - ai-bridge
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minio} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing local/langfuse;
        echo 'MinIO bucket ready';
      "
    restart: on-failure

  # ---------------------------------------------------------------------------
  # Langfuse Worker — async event processor (REQUIRED in v3)
  # ---------------------------------------------------------------------------
  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: langfuse-worker
    networks:
      - ai-bridge
    ports:
      - "127.0.0.1:3030:3030"
    depends_on: &langfuse-depends-on
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-true}
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: ${LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES:-false}
      CLICKHOUSE_MIGRATION_URL: clickhouse://${CLICKHOUSE_USER:-clickhouse}:${CLICKHOUSE_PASSWORD}@clickhouse:9000/${CLICKHOUSE_DATABASE:-default}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clickhouse}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_EXTERNAL_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: us-east-1
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9090
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minio}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_AUTH}
      # Node.js heap cap — qwen3.6's file discovered V8 doesn't reliably
      # respect a Docker cgroup memory limit under real trace-ingestion load;
      # applying the same fix here preemptively rather than after a crash.
      NODE_OPTIONS: "--max-old-space-size=1024"
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Langfuse Web — UI + public ingestion API
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: langfuse
    networks:
      - ai-bridge
    ports:
      - "3000:3000"
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
      NODE_OPTIONS: "--max-old-space-size=1024"
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # vLLM Engine — Inferact/Qwen3.8-27B-NVFP4 (ModelOpt)
  # NVIDIA DGX Spark — GB10 Superchip (128GB unified memory)
  # Swapped from unsloth/Qwen3.8-27B-NVFP4 on 2026-08-24 — see the CHECKPOINT
  # SWAP note at the top of this file for the full why, and the PROVENANCE
  # section right after it for what's verified vs. assumed in the
  # command/environment below. The ARCHIVED section further down preserves
  # the retired Unsloth checkpoint's full investigation history.
  # ---------------------------------------------------------------------------
  qwen3-8-27b-nvfp4-engine:
    image: vllm/vllm-openai:nightly
    platform: linux/arm64
    container_name: qwen3-8-27b-nvfp4-engine
    networks:
      - ai-bridge
    ports:
      - "8301:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      # Same cache volumes as the retired Unsloth checkpoint used — different
      # model means a different autotune cache key regardless, so this just
      # re-tunes fresh into the same volume rather than needing a rename.
      - vllm-qwen38-compile-cache:/root/.cache/vllm
      - vllm-qwen38-flashinfer-cache:/root/.cache/flashinfer
      - vllm-qwen38-triton-cache:/root/.triton/cache
    environment:
      HF_TOKEN: ${HF_TOKEN}
      TRITON_CACHE_DIR: /root/.triton/cache
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      CUTE_DSL_ARCH: sm_121a                # GB10 Blackwell SM architecture — hardware fact, model-independent
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      # CONFIRMED NO-OP for this checkpoint (tested 2026-08-26, twice — with
      # and without --linear-backend marlin below): kernel selection is
      # controlled by --linear-backend, not this legacy env var, on this
      # vLLM build. Left set anyway — harmless, and --linear-backend marlin
      # is the flag actually doing the work now (see RESULT/FOLLOW-UP TEST
      # in the file header).
      VLLM_NVFP4_GEMM_BACKEND: marlin
      # ESCAPE HATCH (leave commented): if generation output looks wrong
      # after a FlashInfer autotune cache load on a newer nightly, uncomment
      # to disable the persistent cache and report upstream.
      # VLLM_DISABLE_FLASHINFER_AUTOTUNE_CACHE: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    shm_size: '16gb'
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 3600s
    # ---------------------------------------------------------------------------
    # --quantization modelopt: explicit, matching qwen3.6's style (this
    # checkpoint's compressed weights auto-detect too, but being explicit
    # matches this project's convention for the proven-good scheme).
    #
    # --tool-call-parser qwen3_coder: the vLLM recipe's explicit recommendation
    # for THIS checkpoint (recipes.vllm.ai/Qwen/Qwen3.8-27B) — different from
    # qwen3_xml, which was only ever an analogy-based guess for the retired
    # Unsloth checkpoint. Still UNVERIFIED against a real Cline/Claude Code
    # tool-calling session — see PROVENANCE section at top of file.
    #
    # --speculative-config: num_speculative_tokens defaults to 3, matching the
    # vLLM recipe's recommendation for this checkpoint (the retired Unsloth
    # checkpoint used 2, per its own docs). QWEN38_NUM_SPECULATIVE_TOKENS
    # (.env) is an A/B toggle, same pattern as qwen3.6's
    # QWEN36_NUM_SPECULATIVE_TOKENS — no "moe_backend" key here, dense model.
    #
    # --override-generation-config: kept at the retired Unsloth checkpoint's
    # "Thinking Mode" defaults (temperature 1.0) as a reasonable carry-over —
    # NOT yet verified against any Inferact-specific documented sampling
    # defaults (none found during this swap's research). Revisit if output
    # quality looks off.
    # ---------------------------------------------------------------------------
    command: >
      Inferact/Qwen3.8-27B-NVFP4
      --served-model-name qwen3.8-27b
      --host 0.0.0.0
      --port 8000
      --dtype auto
      --quantization modelopt
      --kv-cache-dtype fp8
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.6
      --max-model-len 262144
      --max-num-seqs 4
      --enable-chunked-prefill
      --async-scheduling
      --max-num-batched-tokens 8192
      --load-format fastsafetensors
      --mamba-ssm-cache-dtype float32
      --attention-backend flashinfer
      --linear-backend marlin
      --uvicorn-log-level warning
      --trust-remote-code
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
      --enable-prefix-caching
      --speculative-config '{"method":"mtp","num_speculative_tokens":${QWEN38_NUM_SPECULATIVE_TOKENS:-3}}'
      --default-chat-template-kwargs '{"preserve_thinking":true}'
      --override-generation-config '{"temperature":1.0,"top_p":0.95,"top_k":20,"min_p":0.0,"presence_penalty":0.0,"repetition_penalty":1.0}'
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # vLLM Embedding Engine — nvidia/Nemotron-3-Embed-1B-NVFP4
  # Identical to the service in docker-compose.qwen3.6.yml — same model, same
  # cache volume name (vllm-embed-compile-cache is a Docker-host-wide named
  # volume, not scoped to one compose file, so it's reused as-is here without
  # re-downloading or re-compiling).
  # Source: https://huggingface.co/nvidia/Nemotron-3-Embed-1B-NVFP4
  # ---------------------------------------------------------------------------
  nemotron-embed-engine:
    image: vllm/vllm-openai:nightly
    platform: linux/arm64
    container_name: nemotron-embed-engine
    networks:
      - ai-bridge
    ports:
      - "8302:8000"
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
      - vllm-embed-compile-cache:/root/.cache/vllm
    environment:
      HF_TOKEN: ${HF_TOKEN}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ipc: host
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 60
      start_period: 900s
    command: >
      nvidia/Nemotron-3-Embed-1B-NVFP4
      --served-model-name nemotron-3-embed-1b-nvfp4
      --host 0.0.0.0
      --port 8000
      --max-model-len 32768
      --max-num-batched-tokens 32768
      --max-cudagraph-capture-size 4096
      --gpu-memory-utilization 0.1
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # LiteLLM Proxy — unified OpenAI-compatible API + Langfuse OTEL tracing
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm-proxy
    networks:
      - ai-bridge
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - ./litellm-callbacks/anthropic_input_text_fix.py:/app/anthropic_input_text_fix.py:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DROP_PARAMS: ${LITELLM_DROP_PARAMS:-true}
      LITELLM_MODIFY_PARAMS: ${LITELLM_MODIFY_PARAMS:-true}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_OTEL_HOST: http://langfuse:3000
      LANGFUSE_HOST: ${LANGFUSE_HOST}
      LITELLM_CACHE: "true"
      LITELLM_CACHE_TYPE: "redis"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_AUTH}
    depends_on:
      postgres:
        condition: service_healthy
      qwen3-8-27b-nvfp4-engine:
        condition: service_healthy
      nemotron-embed-engine:
        condition: service_healthy
      langfuse-web:
        condition: service_started
      redis:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000", "--drop_params"]
    deploy:
      resources:
        limits:
          memory: 1G
    restart: always

# =============================================================================
# Networks
# =============================================================================
networks:
  ai-bridge:
    driver: bridge

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  langfuse-postgres-data:
  langfuse-clickhouse-data:
  langfuse-clickhouse-logs:
  langfuse-minio-data:
  langfuse-redis-data:
  vllm-qwen38-compile-cache:      # persists /root/.cache/vllm (torch.compile + FlashInfer autotune configs)
  vllm-qwen38-flashinfer-cache:   # persists /root/.cache/flashinfer (FlashInfer JIT kernel workspace)
  vllm-qwen38-triton-cache:       # persists /root/.triton/cache (Triton kernel JIT cache)
  vllm-embed-compile-cache:       # shared with docker-compose.qwen3.6.yml — same embedding model
