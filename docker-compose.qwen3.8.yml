# =============================================================================
# docker-compose.qwen3.8.yml — Qwen3.8-27B-NVFP4 (Inferact, ModelOpt) on NVIDIA DGX Spark (GB10)
#
# Main stack configuration. Includes full Langfuse/LiteLLM observability stack.
# EXPERIMENTAL — docker-compose.qwen3.6.yml is the default/primary stack as of
# 2026-08-24 (see CHANGELOG.md). This file is kept fully buildable as the
# next-to-revisit option.
#
# Usage:
#   docker compose -f docker-compose.qwen3.8.yml up -d
#
# USE CASE: serving Cline and Claude Code (AI coding agents) via LiteLLM.
# PRIORITY: runtime coding performance over startup/restart time — same
# deliberate priority docker-compose.qwen3.6.yml documents for the same
# use case.
#
# =============================================================================
# CHECKPOINT SWAP (2026-08-24): unsloth/Qwen3.8-27B-NVFP4 → Inferact/Qwen3.8-27B-NVFP4
# =============================================================================
# The Unsloth checkpoint (compressed-tensors NVFP4+FP8) is RETIRED from this
# file as of this swap — its full PROVENANCE/CORRECTIONS HISTORY is preserved
# below under "ARCHIVED", not deleted, per this project's standing policy of
# keeping abandoned configs as reference (see also the .unsloth-nvfp4-fast.bak
# sibling next to docker-compose.qwen3.6.yml).
#
# WHY: the Unsloth checkpoint's throughput investigation (CHANGELOG.md,
# 2026-08-23/24) found no working fix for its ~20 tok/s (vs qwen3.6's ~40-84
# tok/s) — 96% GPU utilization at only ~34W power draw, consistent with
# immature SM121 kernel support for its compressed-tensors NVFP4+FP8 scheme.
# Forcing Marlin (the fix that works for qwen3.6's NVFP4) crashed instead:
# `AttributeError: 'ParallelLMHead' object has no attribute
# 'output_size_per_partition'` — because Unsloth's checkpoint has an
# FP8-quantized lm_head, and vLLM's Marlin FP8 weight-prep path doesn't
# handle that layer type.
#
# The Inferact checkpoint was suggested by the user with a pasted analysis
# (citing recipes.vllm.ai) claiming better MTP acceptance (0.897 vs 0.788)
# and 545K+ HF downloads. That pasted analysis had real red flags — malformed
# citation markup consistent with an unverified secondary AI summary, and
# specific numbers that don't fully agree with what this session's own direct
# fetches found (a WebFetch summary of the HF page said "8-bit precision,
# BF16/U8"; the recipe page summary said "uniform W4A4"; raw config.json —
# see below — settled it: it's genuinely NVFP4, W4A4-style, group size 16).
# The benchmark numbers (KV tokens, weights/GPU, MTP acceptance) come from
# the recipe's own 2x RTX 5090 benchmark table, NOT verified on GB10 — treat
# them as directional, not as confirmed facts for this hardware.
#
# What WAS verified directly this session (raw config.json fetch, same method
# used for the Unsloth checkpoint originally):
#   - architectures: ["Qwen3_5ForConditionalGeneration"], model_type: "qwen3_5"
#     — SAME architecture class as both the Unsloth checkpoint and qwen3.6.
#   - quantization_config: quant_method "modelopt", quant_algo "NVFP4",
#     producer "modelopt" v0.0.1.dev1+ga21173a4d, group size 16 for both
#     weights and input activations (genuinely W4A4, not the vague "8-bit"
#     a WebFetch summary claimed).
#   - ignored_layers includes "lm_head", embedding tokens, "model.visual*",
#     and "mtp*" — i.e. lm_head is NOT quantized. This directly sidesteps the
#     exact bug that crashed the Unsloth checkpoint when Marlin was forced.
#   - max_position_embeddings: 262144. Same 27B dense, vision-capable, hybrid
#     Gated-DeltaNet + Gated-Attention architecture as the Unsloth checkpoint.
#
# THE KEY REASON THIS IS WORTH TRYING: quant_method "modelopt" is NVIDIA's
# own quantization library — the SAME scheme qwen3.6 uses successfully via
# the Marlin kernel fallback on SM121 (see qwen3.6's own corrections history,
# archived PROVENANCE below, and CLAUDE.md's "IMPORTANT — FP4 compute on
# GB10" note). This is a real, evidence-based reason to expect this
# checkpoint's kernel path to behave like qwen3.6's proven-fast one, not
# marketing.
#
# RESULT (tested 2026-08-26, real boot on this hardware): the reasoning above
# did NOT pan out. Boot was clean — architecture, MTP drafter, and KV cache
# allocation (24.74 GiB available at --gpu-memory-utilization 0.6, weights
# 24.97 GiB) all resolved without error, and VLLM_NVFP4_GEMM_BACKEND=marlin
# had no effect either way: vLLM auto-selected the NATIVE
# FlashInferCutlassNvFp4LinearKernel for NVFP4 GEMM, same as the retired
# Unsloth checkpoint, NOT Marlin (unlike qwen3.6, which does use Marlin for
# its ModelOpt scheme on this same hardware/vLLM build — same quant_method,
# different kernel outcome, reason unconfirmed). Real generation throughput:
# 700 tokens in 39.95s = 17.52 tok/s, with 96% GPU utilization but only ~34W
# power draw — the SAME low-power-despite-busy signature the retired Unsloth
# checkpoint showed at ~20 tok/s. The recipe's benchmark claims (0.897 MTP
# acceptance, etc., measured on 2x RTX 5090) do NOT translate to this
# DGX Spark + vLLM nightly combination. This checkpoint does not solve the
# throughput problem either — it performs in the same class as the retired
# Unsloth checkpoint (worse, on this one test).
#
# FOLLOW-UP TEST (also 2026-08-26): added --linear-backend marlin to the
# command below to test whether forcing the SAME kernel qwen3.6 uses
# successfully would close the gap. This time it worked at the kernel-
# selection level — log confirmed "Using MarlinNvFp4LinearKernel for NVFP4
# GEMM" (unlike the VLLM_NVFP4_GEMM_BACKEND=marlin env var above, which was a
# no-op both times it was tried on a Qwen3.8 checkpoint). Clean boot, no
# crash (unlike forcing Marlin on the Unsloth checkpoint, consistent with
# this checkpoint's unquantized lm_head), even MORE KV cache headroom than
# the native-kernel run (29.32 GiB vs 24.74 GiB). Real generation throughput
# with Marlin: 700 tokens in 37.74s = 18.55 tok/s — only ~6% higher than the
# native-kernel run (17.52 tok/s), within noise, still nowhere near qwen3.6's
# 83.25 tok/s on the identical prompt. Same ~96%/34-35W signature persisted
# even with Marlin active.
#
# REVISED CONCLUSION: kernel choice (native Cutlass vs Marlin) is NOT the
# primary bottleneck for this checkpoint — ruled out empirically, not just
# theoretically, since forcing the exact kernel that makes qwen3.6 fast
# barely moved the number. The dominant factor is much more likely
# ARCHITECTURAL: qwen3.6 is MoE (~3B of 35B params active per token);
# Qwen3.8 (both checkpoints) is DENSE (all 27B params active every token) —
# roughly 9x more weight to stream through memory per generated token,
# independent of kernel efficiency. This reframes the earlier "immature
# SM121 kernel support" theory from the Unsloth investigation — that
# framing is likely wrong, or at best a minor contributor next to the
# architectural one. A newer vLLM/CUTLASS build is less likely to close this
# gap than earlier assumed; a genuinely faster Qwen3.8 config on this
# hardware would need either a smaller/sparser (MoE) variant of this model
# family, or accepting dense-model throughput as inherently lower here.
# qwen3.6 remains the default and the only proven-fast option (~83 tok/s).
# This file is left configured for Inferact + --linear-backend marlin
# (the best-tested combination) rather than reverted to Unsloth or to the
# native kernel — no evidence any of the three options tried is meaningfully
# better than the others.
#
