# =============================================================================
# docker-compose.agentgateway.yml — agentgateway trial, ALONGSIDE litellm-proxy
#
# Start with:  ./scripts/agentgateway-up.sh        (computes the Langfuse auth)
# Stop with:   docker compose -f docker-compose.agentgateway.yml down
#              (only touches the agentgateway container)
#
# Standalone overlay: it does not redefine any service from the model stacks.
# It joins the ai-bridge network created by whichever model stack is running
# (docker-compose.qwen3.8.yml etc.), so that stack must be up first.
#
# Ports:
#   4100            — agentgateway LLM API (LiteLLM stays on 4000) and MCP at
#                     /mcp/image-gen (API key on both)
#   127.0.0.1:4101  — agentgateway UI (unauthenticated; local only)
#
# restart: unless-stopped, not always — avoids piling onto a bad boot after a
# driver/kernel update (see ~/.claude/CLAUDE.md).
# =============================================================================

# Own project name: without it this file shares the "ai-litellm-proxy" project
# with the model stacks, and `down --remove-orphans` here would remove them.
name: ai-litellm-agentgateway

services:
  agentgateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    container_name: agentgateway
    user: "1000:1000"
    networks:
      - ai-bridge
    ports:
      - "4100:4100"
      - "127.0.0.1:4101:4101"
    volumes:
      # Read-only: config lives in git. UI edits won't persist (by design).
      - ./agentgateway/config.yaml:/config.yaml:ro
      - ./agentgateway/data:/data
      # Generated by scripts/agentgateway-sync-costs.py from Langfuse prices.
      - ./agentgateway/costs:/costs:ro
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AGW_LANGFUSE_BASIC_AUTH: ${AGW_LANGFUSE_BASIC_AUTH:?run via scripts/agentgateway-up.sh}
    command: ["-f", "/config.yaml"]
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

networks:
  ai-bridge:
    external: true
    name: ai-litellm-proxy_ai-bridge
